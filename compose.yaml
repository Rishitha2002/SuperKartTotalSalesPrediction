services:
  backend:
    build: ./backend_files
    ports:
      - "7860:7860"

  frontend:
    build: ./frontend_files
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://host.docker.internal:7860
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
